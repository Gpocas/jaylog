[project]
name = "jaylog"
version = "0.3.0a3"
description = "Customized Python logging library with file rotation and HTTP forwarding"
readme = "README.md"
authors = [
    { name = "Gpocas", email = "gpocas01@gmail.com" }
]

classifiers = [
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: Portuguese (Brazilian)",
    "Development Status :: 5 - Production/Stable",
]

requires-python = ">=3.10,<3.14"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "requests>=2.32,<3.0",
    "pillow>=11.0,<13.0",
]

[project.urls]
repository = "https://github.com/Gpocas/jaylog"
"Bug Tracker" = "https://github.com/Gpocas/jaylog/issues"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
